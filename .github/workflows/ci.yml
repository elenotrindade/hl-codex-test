name: CI

on:
  pull_request:
    branches: [train-graffiti-painting-interactive-page-igmfrg]
  push:
    branches: [train-graffiti-painting-interactive-page-igmfrg]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
